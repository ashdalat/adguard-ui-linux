<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Hat / Cap -->
  <path d="M42 42 C42 28, 78 28, 78 42 Z" fill="#58A868"/>
  <ellipse cx="60" cy="42" rx="24" ry="5" fill="#4B955A"/>
  <!-- Head -->
  <circle cx="60" cy="54" r="16" fill="#FADCB8"/>
  <!-- Eyes -->
  <circle cx="55" cy="51" r="2.5" fill="#222"/>
  <circle cx="67" cy="51" r="2.5" fill="#222"/>
  <!-- Nose & Smile -->
  <path d="M59 55 Q60 57 61 55" stroke="#D89D70" stroke-width="1.5" fill="none"/>
  <!-- Beard -->
  <path d="M47 54 C45 68, 75 68, 73 54 C70 60, 50 60, 47 54 Z" fill="#D3D3D8"/>
  <!-- Coat / Body -->
  <path d="M38 72 C38 65, 82 65, 82 72 L86 98 L34 98 Z" fill="#E8E8EC"/>
  <!-- Collar -->
  <path d="M48 68 L60 78 L72 68" stroke="#58A868" stroke-width="3" fill="none"/>
