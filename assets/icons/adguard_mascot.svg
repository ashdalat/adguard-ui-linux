  <circle cx="68" cy="49" r="11" fill="#E6F4EA" fill-opacity="0.6" stroke="#555" stroke-width="2.5"/>
  <circle cx="68" cy="49" r="8" fill="none" stroke="#88D49E" stroke-width="1.5"/>
  <line x1="77" y1="57" x2="88" y2="70" stroke="#7A4B22" stroke-width="4" stroke-linecap="round"/>
  <!-- Hand holding magnifying glass -->
  <circle cx="80" cy="62" r="4.5" fill="#FADCB8"/>
  <!-- Shield in left hand -->
  <path d="M35 70 L48 66 L48 82 C48 91, 35 96, 35 96 C35 96, 22 91, 22 82 L22 66 Z" fill="#58A868" stroke="#3D7B4A" stroke-width="2"/>
  <!-- Checkmark on shield -->
