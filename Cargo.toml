[package]
name = "adguard-blocker-rebuilt"
version = "8.0.0"
edition = "2021"
description = "AdGuard Blocker - GTK4 GUI for adguard-cli (CachyOS), re-ported from the Python app"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
regex = "1"
nix = { version = "0.29", features = ["socket", "poll", "term"] }
ksni = "0.2"
serde_json = "1"
cairo = { package = "cairo-rs", version = "0.20" }

[profile.release]
opt-level = 2
lto = true
strip = true
